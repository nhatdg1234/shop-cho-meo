    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const CART_KEY = 'vku_cart';
            const cartPageContent = document.getElementById('cartPageContent');
            const finalTotalEl = document.getElementById('finalTotal');
            const subTotalEl = document.getElementById('subTotal');
            const sidebarItemsList = document.getElementById('sidebar-items-list');
            
            function formatPrice(value){
                return new Intl.NumberFormat('vi-VN').format(value) + 'đ';
            }

            function getCart(){
                try { return JSON.parse(localStorage.getItem(CART_KEY)) || {}; }
                catch(e){ return {}; }
            }

            function saveCart(cart){
                localStorage.setItem(CART_KEY, JSON.stringify(cart));
            }

            function renderCartPage() {
                const cart = getCart();
                const items = Object.keys(cart);
                let total = 0;

                if (items.length === 0) {
                    cartPageContent.innerHTML = '<div class="text-center py-12"><p class="text-gray-500">Giỏ hàng của bạn đang trống.</p><a href="mua_hang.php" class="text-orange-500 font-bold underline">Mua sắm ngay</a></div>';
                    finalTotalEl.textContent = '0đ';
                    subTotalEl.textContent = '0đ';
                    sidebarItemsList.innerHTML = '';
                    return;
                }

                let mainHtml = '';
                let sidebarHtml = '';
                
                items.forEach((id, index) => {
                    const item = cart[id];
                    total += item.price * item.qty;
                    const imgSrc = item.image ? '../anh/' + item.image : '../anh/anh_logo.png';
                    const pastelBg = index % 2 === 0 ? 'bg-[#FFE7E7]' : 'bg-[#FFF1B8]';

                    mainHtml += `
                    <div class="flex items-center justify-between p-4 border-b last:border-0 hover:bg-gray-50 transition-colors rounded-xl mb-2">
                        <div class="flex items-center gap-4">
                            <div class="${pastelBg} w-20 h-20 rounded-2xl flex items-center justify-center p-2">
                                <img src="${imgSrc}" class="max-w-full max-h-full object-contain rounded-lg">
                            </div>
                            <div>
                                <p class="font-bold text-gray-800">${item.name}</p>
                                <p class="text-xs text-gray-400">Size: M | Vị: Gà</p>
                                <p class="text-orange-500 font-bold mt-1">${formatPrice(item.price)}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-6">
                            <div class="flex items-center bg-gray-100 rounded-full px-3 py-1 gap-3">
                                <button class="btn-minus text-gray-500 hover:text-orange-500" data-id="${id}">-</button>
                                <span class="font-medium w-4 text-center">${item.qty}</span>
                                <button class="btn-plus text-gray-500 hover:text-orange-500" data-id="${id}">+</button>
                            </div>
                            <i class="far fa-trash-alt text-gray-300 hover:text-red-500 cursor-pointer transition-colors btn-delete" data-id="${id}"></i>
                        </div>
                    </div>`;

                    sidebarHtml += `
                    <div class="flex items-center justify-between text-sm">
                        <div class="flex items-center gap-3">
                            <div class="relative w-10 h-10 ${pastelBg} rounded-lg flex items-center justify-center p-1">
                                <img src="${imgSrc}" class="max-w-full max-h-full object-contain rounded-sm">
                                <span class="absolute -top-2 -left-2 bg-black text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center">${item.qty}</span>
                            </div>
                            <span class="text-gray-600 truncate w-32">${item.name}</span>
                        </div>
                        <span class="font-medium">${formatPrice(item.price * item.qty)}</span>
                    </div>`;
                });

                cartPageContent.innerHTML = mainHtml;
                sidebarItemsList.innerHTML = sidebarHtml;
                finalTotalEl.textContent = formatPrice(total);
                subTotalEl.textContent = formatPrice(total);
                attachCartEvents();
            }

            function attachCartEvents() {
                document.querySelectorAll('.btn-plus').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const id = this.getAttribute('data-id');
                        const cart = getCart();
                        cart[id].qty += 1;
                        saveCart(cart);
                        renderCartPage();
                    });
                });

                document.querySelectorAll('.btn-minus').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const id = this.getAttribute('data-id');
                        const cart = getCart();
                        if (cart[id].qty > 1) {
                            cart[id].qty -= 1;
                            saveCart(cart);
                            renderCartPage();
                        }
                    });
                });

                document.querySelectorAll('.btn-delete').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const id = this.getAttribute('data-id');
                        const cart = getCart();
                        delete cart[id];
                        saveCart(cart);
                        renderCartPage();
                    });
                });
            }

            renderCartPage();
        });
    </script>
