<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông tin giao hàng - VKU Pet Shop</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="checkout-global.css">
</head>
<body>
    <header class="header-vku">
        <div class="logo">VKU PET SHOP</div>
        <nav class="nav-icons">
            <span>Tìm kiếm</span>
            <span>Yêu thích</span>
            <span>Giỏ hàng (0)</span>
        </nav>
    </header>

    <div class="stepper-container">
        <div class="step-item active"><div class="step-circle">1</div> Giỏ hàng</div>
        <div class="step-line"></div>
        <div class="step-item active"><div class="step-circle">2</div> Giao hàng</div>
        <div class="step-line"></div>
        <div class="step-item"><div class="step-circle">3</div> Thanh toán</div>
        <div class="step-line"></div>
        <div class="step-item"><div class="step-circle">4</div> Hoàn tất</div>
    </div>

    <div class="checkout-wrapper">
        <div class="main-content">
            <div class="ui-card">
                <h3>Thông tin giao hàng</h3>
                <form id="shippingForm">
                    <div class="form-group">
                        <label>Họ tên</label>
                        <input type="text" id="fullName" required>
                    </div>
                    <div class="form-group">
                        <label>Số điện thoại</label>
                        <input type="tel" id="phone" required>
                    </div>
                    <div class="form-group">
                        <label>Tỉnh/Thành</label>
                        <select id="province" required><option value="">Chọn Tỉnh/Thành</option></select>
                    </div>
                    <div class="form-group">
                        <label>Quận/Huyện</label>
                        <select id="district" required><option value="">Chọn Quận/Huyện</option></select>
                    </div>
                    <div class="form-group">
                        <label>Phường/Xã</label>
                        <select id="ward" required><option value="">Chọn Phường/Xã</option></select>
                    </div>
                    <div class="form-group">
                        <label>Địa chỉ chi tiết</label>
                        <input type="text" id="address" required>
                    </div>
                    <div class="form-group">
                        <label>Ghi chú</label>
                        <textarea id="notes"></textarea>
                    </div>
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <a href="giohang.html" style="color: #666;">Quay lại giỏ hàng</a>
                        <button type="submit" class="btn btn-submit" style="padding:10px 20px; background:#fb8500; color:white; border:none; border-radius:8px; cursor:pointer;">Tiếp tục thanh toán</button>
                    </div>
                </form>
            </div>
        </div>
        <div class="sidebar-content">
            <div class="ui-card">
                <h3>Tóm tắt đơn hàng</h3>
                <p>Tổng tiền: <strong id="totalDisplay" style="color: #e53935; font-size: 1.2em;">0đ</strong></p>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const cart = JSON.parse(localStorage.getItem('vku_cart')) || {};
            const total = Object.values(cart).reduce((sum, item) => sum + (item.price * item.qty), 0);
            document.getElementById('totalDisplay').textContent = new Intl.NumberFormat('vi-VN').format(total) + 'đ';

            const provinceSelect = document.getElementById('province');
            const districtSelect = document.getElementById('district');
            const wardSelect = document.getElementById('ward');
            const form = document.getElementById('shippingForm');

            fetch('https://provinces.open-api.vn/api/p/')
                .then(res => res.json())
                .then(data => {
                    data.forEach(p => {
                        const option = document.createElement('option');
                        option.value = p.code;
                        option.textContent = p.name;
                        provinceSelect.appendChild(option);
                    });
                });

            provinceSelect.addEventListener('change', function() {
                districtSelect.innerHTML = '<option value="">Chọn Quận/Huyện</option>';
                wardSelect.innerHTML = '<option value="">Chọn Phường/Xã</option>';
                if (!this.value) return;
                fetch(`https://provinces.open-api.vn/api/p/${this.value}?depth=2`)
                    .then(res => res.json())
                    .then(data => {
                        data.districts.forEach(d => {
                            const option = document.createElement('option');
                            option.value = d.code;
                            option.textContent = d.name;
                            districtSelect.appendChild(option);
                        });
                    });
            });

            districtSelect.addEventListener('change', function() {
                wardSelect.innerHTML = '<option value="">Chọn Phường/Xã</option>';
                if (!this.value) return;
                fetch(`https://provinces.open-api.vn/api/d/${this.value}?depth=2`)
                    .then(res => res.json())
                    .then(data => {
                        data.wards.forEach(w => {
                            const option = document.createElement('option');
                            option.value = w.code;
                            option.textContent = w.name;
                            wardSelect.appendChild(option);
                        });
                    });
            });

            form.addEventListener('submit', function(e) {
                e.preventDefault();
                const shippingInfo = {
                    fullName: document.getElementById('fullName').value,
                    phone: document.getElementById('phone').value,
                    address: document.getElementById('address').value,
                    province: provinceSelect.options[provinceSelect.selectedIndex].text,
                    district: districtSelect.options[districtSelect.selectedIndex].text,
                    ward: wardSelect.options[wardSelect.selectedIndex].text,
                    notes: document.getElementById('notes').value
                };
                localStorage.setItem('vku_shipping', JSON.stringify(shippingInfo));
                window.location.href = 'tratien.html'; 
            });
        });
    </script>
</body>
</html>
