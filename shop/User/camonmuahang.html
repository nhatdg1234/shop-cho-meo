<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đặt hàng thành công - VKU Pet Shop</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="checkout-global.css">
</head>
<body>
    <header class="header-vku">
        <div class="logo">VKU PET SHOP</div>
        <nav class="nav-icons">
            <span>Tìm kiếm</span>
            <span>Yêu thích</span>
            <span>Giỏ hàng (0)</span>
        </nav>
    </header>

    <div class="stepper-container">
        <div class="step-item active"><div class="step-circle">1</div> Giỏ hàng</div>
        <div class="step-line"></div>
        <div class="step-item active"><div class="step-circle">2</div> Giao hàng</div>
        <div class="step-line"></div>
        <div class="step-item active"><div class="step-circle">3</div> Thanh toán</div>
        <div class="step-line"></div>
        <div class="step-item active"><div class="step-circle">4</div> Hoàn tất</div>
    </div>

    <div class="checkout-wrapper" style="justify-content: center;">
        <div class="main-content ui-card" style="text-align: center; padding: 50px;">
            <div style="font-size: 80px; color: #4caf50; margin-bottom: 20px;">✓</div>
            <h2>Đặt hàng thành công! 🎉</h2>
            <p>Cảm ơn bạn đã mua sắm tại VKU Pet Shop. Đơn hàng của bạn đã được ghi nhận.</p>
            <div id="displayOrderCode" style="padding: 10px 20px; background: #fff3e0; color: #e65100; border-radius: 20px; font-weight: bold; display: inline-block; margin: 15px 0;"></div>
            <div style="margin-top: 30px; display: flex; justify-content: center; gap: 15px;">
                <a href="home.php" style="padding: 12px 25px; border-radius: 8px; text-decoration: none; font-weight: bold; border: 2px solid #ff9800; color: #ff9800;">Đặt đơn mới</a>
                <a href="#" style="padding: 12px 25px; border-radius: 8px; text-decoration: none; font-weight: bold; background: #ff9800; color: white;">Theo dõi đơn hàng</a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const orderCode = localStorage.getItem('last_order_code');
            const orderCodeEl = document.getElementById('displayOrderCode');
            if (orderCode && orderCodeEl) orderCodeEl.textContent = 'Mã đơn hàng: ' + orderCode;
        });
    </script>
</body>
</html>
