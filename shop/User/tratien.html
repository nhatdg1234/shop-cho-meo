<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thanh toán - VKU Pet Shop</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="checkout-global.css">
</head>
<body>
    <header class="header-vku">
        <div class="logo">VKU PET SHOP</div>
        <nav class="nav-icons">
            <span>Tìm kiếm</span>
            <span>Yêu thích</span>
            <span>Giỏ hàng (0)</span>
        </nav>
    </header>

    <div class="stepper-container">
        <div class="step-item active"><div class="step-circle">1</div> Giỏ hàng</div>
        <div class="step-line"></div>
        <div class="step-item active"><div class="step-circle">2</div> Giao hàng</div>
        <div class="step-line"></div>
        <div class="step-item active"><div class="step-circle">3</div> Thanh toán</div>
        <div class="step-line"></div>
        <div class="step-item"><div class="step-circle">4</div> Hoàn tất</div>
    </div>

    <div class="checkout-wrapper">
        <div class="main-content">
            <div class="ui-card">
                <h3>Chọn phương thức thanh toán</h3>
                <div class="payment-card" style="border: 2px solid #ff9800; border-radius: 12px; padding: 20px; background: white; position: relative;">
                    <span class="badge" style="background: #8bc34a; color: white; padding: 2px 8px; border-radius: 4px; font-size: 12px; position: absolute; top: 10px; right: 10px;">Khuyên dùng</span>
                    <input type="radio" checked> <strong>Chuyển khoản VietQR</strong>
                    <div class="qr-box" style="border: 2px dashed #ff9800; padding: 20px; border-radius: 12px; text-align: center; margin-top: 20px;">
                        <img id="vietqr-image" src="" alt="QR Code Thanh toán" style="max-width: 200px;">
                        <p style="color: #ff9800; font-weight: bold; margin-top: 10px;">Quét mã để thanh toán tự động</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="sidebar-content shop-summary-box">
            <div class="ui-card">
                <button type="button" id="btnConfirmOrder" class="btn-confirm" style="width: 100%; padding: 15px; background: linear-gradient(to right, #ff9800, #f57c00); color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 20px;">Xác nhận đặt hàng</button>
                <a href="diachigiaohang.html" class="btn-back" style="display: block; text-align: center; margin-top: 15px; color: #ff9800; text-decoration: none; font-weight: bold;">Quay lại</a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const btnConfirm = document.getElementById('btnConfirmOrder');
            const qrImage = document.getElementById('vietqr-image');
            
            function renderOrderSummary() {
                const cart = JSON.parse(localStorage.getItem('vku_cart')) || {};
                const sidebarContent = document.querySelector('.shop-summary-box');
                
                let total = 0;
                let htmlItems = '<h4>Tóm tắt đơn hàng</h4>';

                Object.values(cart).forEach(item => {
                    total += item.price * item.qty;
                    htmlItems += `
                        <div style="display:flex; justify-content:space-between; margin-bottom:10px; font-size:14px;">
                            <span>${item.name} (x${item.qty})</span>
                            <span>${new Intl.NumberFormat('vi-VN').format(item.price * item.qty)}₫</span>
                        </div>
                    `;
                });

                htmlItems += `
                    <hr style="border:none; border-top:1px dashed #ddd; margin:15px 0;">
                    <div style="display:flex; justify-content:between; font-weight:bold; color:#e65100; font-size:16px; margin-bottom:15px;">
                        <span>Tổng thanh toán:</span>
                        <span style="margin-left:auto;">${new Intl.NumberFormat('vi-VN').format(total)}₫</span>
                    </div>
                `;
                
                if(sidebarContent) {
                    const itemsContainer = document.getElementById('sidebar-items-list') || document.createElement('div');
                    itemsContainer.id = 'sidebar-items-list';
                    itemsContainer.innerHTML = htmlItems;
                    sidebarContent.insertBefore(itemsContainer, btnConfirm);
                }

                return total;
            }

            function renderVietQR(totalPrice) {
                const tempOrderCode = 'VKU' + Date.now().toString().slice(-6);
                if (qrImage && totalPrice > 0) {
                    const accountName = encodeURIComponent('VKU PET SHOP');
                    const addInfo = encodeURIComponent(tempOrderCode);
                    qrImage.src = `https://img.vietqr.io/image/970436-123456789012-compact2.png?amount=${totalPrice}&addInfo=${addInfo}&accountName=${accountName}`;
                }
            }

            const finalTotal = renderOrderSummary();
            renderVietQR(finalTotal);

            if(btnConfirm) {
                btnConfirm.addEventListener('click', function() {
                    const cart = JSON.parse(localStorage.getItem('vku_cart')) || {};
                    const shipping = JSON.parse(localStorage.getItem('vku_shipping')) || {};
                    fetch('checkout_api.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ cart: cart, shipping: shipping })
                    })
                    .then(res => res.json())
                    .then(data => {
                        if(data.success) {
                            localStorage.removeItem('vku_cart');
                            localStorage.removeItem('vku_shipping');
                            localStorage.setItem('last_order_code', data.order_code);
                            window.location.href = 'camonmuahang.html';
                        }
                    });
                });
            }
        });
    </script>
</body>
</html>
